<title>有田英輝｜きくや美粧堂 浅草支店</title>
<style>
  :root {
    --bg: #171a1c;
    --card: #1f2326;
    --line: #2e3337;
    --text: #f2efe9;
    --muted: #9ea4a8;
    --accent: #c9a96e;
    --btn-text: #171a1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px 48px;
  }
  main { width: 100%; max-width: 420px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--accent);
    text-align: center;
  }
  .portrait {
    display: block;
    width: 132px;
    height: 132px;
    margin: 0 auto 20px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--line);
    background: var(--card);
  }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: .12em;
    margin: 10px 0 6px;
  }
  .org { color: var(--muted); font-size: 14px; }
  .actions { display: grid; gap: 10px; margin-bottom: 28px; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 16px;
    border-radius: 12px;
  }
  .btn-primary { background: var(--accent); color: var(--btn-text); }
  .btn-line { background: #06c755; color: #fff; }
  dl {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
  dd { font-size: 15px; word-break: break-all; }
  dd a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--accent); }
  .note {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    margin: 20px 0 32px;
  }
  footer { text-align: center; }
</style>
